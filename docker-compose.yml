services:
  readtrackr:
    build: .
    container_name: readtrackr
    restart: unless-stopped
    env_file: .env
    volumes:
      - readtrackr_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  readtrackr_data:
