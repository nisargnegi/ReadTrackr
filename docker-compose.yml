services:
  readtrackr:
    build: .
    container_name: readtrackr
    restart: unless-stopped
    env_file: .env
    volumes:
      - readtrackr_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  readtrackr-backfill:
    build: .
    container_name: readtrackr-backfill
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "while true; do python -m app.backfill --limit 20; sleep $${BACKFILL_INTERVAL_SECONDS:-21600}; done"]
    volumes:
      - readtrackr_data:/app/data
volumes:
  readtrackr_data:
